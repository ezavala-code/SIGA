name: siga-tests
services:
  db-test:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: siga_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Ejecuta npm run setup}
      POSTGRES_DB: siga_test
    ports: ['127.0.0.1:5433:5432']
    tmpfs: ['/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U siga_test -d siga_test']
      interval: 5s
      timeout: 3s
      retries: 10
