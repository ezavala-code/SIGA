name: siga-demo
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: siga_demo
      POSTGRES_DB: siga_demo
      POSTGRES_PASSWORD: ${SIGA_DEMO_DB_PASSWORD:?Falta configuracion de demo}
    volumes: ['demo_db:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U siga_demo -d siga_demo']
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    image: siga-demo-migrate:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://siga_demo:${SIGA_DEMO_DB_PASSWORD}@db:5432/siga_demo
    depends_on:
      db: { condition: service_healthy }
  seed:
    image: siga-demo-migrate:local
    command: ['node', '/demo/seed-demo.mjs']
    volumes: ['./scripts/seed-demo.mjs:/demo/seed-demo.mjs:ro']
    environment:
      DATABASE_URL: postgresql://siga_demo:${SIGA_DEMO_DB_PASSWORD}@db:5432/siga_demo
      SIGA_DEMO_PASSWORD: ${SIGA_DEMO_PASSWORD:?Falta contrasena de demo}
      SIGA_DEMO_SEED: 'true'
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    image: siga-demo-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      PORT: 3000
      WEB_ORIGIN: http://localhost:${SIGA_DEMO_WEB_PORT:-18080}
      DATABASE_URL: postgresql://siga_demo:${SIGA_DEMO_DB_PASSWORD}@db:5432/siga_demo
      JWT_SECRET: ${SIGA_DEMO_JWT_SECRET:?Falta secreto de demo}
      CERTIFICATES_DIR: /data/certificados
      COOKIE_SECURE: 'false'
      EXIGIR_PRERREQUISITOS: 'true'
    volumes: ['demo_certificados:/data/certificados']
    depends_on:
      seed: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    image: siga-demo-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['127.0.0.1:${SIGA_DEMO_WEB_PORT:-18080}:80']
    depends_on:
      api: { condition: service_healthy }
volumes:
  demo_db:
  demo_certificados:
